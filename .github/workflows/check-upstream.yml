name: Check upstream update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare and trial-merge upstream
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'upstream compatibility check'
          git config user.email 'actions@users.noreply.github.com'
          git fetch https://github.com/jmapio/jmap-perl.git master
          head=$(git rev-parse FETCH_HEAD)
          base=$(cat UPSTREAM_REVISION)
          echo "Current upstream base: $base" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest upstream commit: $head" >> "$GITHUB_STEP_SUMMARY"
          if [ "$head" = "$base" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Already up to date. Production was not changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-commit --no-ff "$head"; then
            echo 'Manual merge needed for these files:' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' "$head" > UPSTREAM_REVISION
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'Trial merge succeeded; testing the candidate only, without publishing.' >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
        if: steps.upstream.outputs.changed == 'true'
      - uses: docker/build-push-action@v6
        if: steps.upstream.outputs.changed == 'true'
        with:
          context: .
          file: Dockerfile.release
          load: true
          tags: jmap-upstream:candidate
          cache-from: type=gha,scope=linux-amd64
      - if: steps.upstream.outputs.changed == 'true'
        run: sh bin/smoke-image.sh jmap-upstream:candidate
