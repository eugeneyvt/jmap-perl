name: Test and publish fork image

on:
  push:
    branches: [ 'master' ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Not github.repository: the repo is jmap-perl, the image is jmap-proxy.
  IMAGE_NAME: eugeneyvt/jmap-proxy

jobs:
  # Each architecture builds natively on its own runner and pushes an
  # untagged, digest-addressed image; the merge job collects those digests
  # into one multi-arch tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" = tag && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must be vMAJOR.MINOR.PATCH; refusing to publish stable.'
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        # push-by-digest needs the docker-container driver, not the
        # default docker driver.
        uses: docker/setup-buildx-action@v3

      - name: Extract labels for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and test candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          load: true
          tags: jmap-candidate:${{ matrix.arch }}
          build-args: FORK_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}

      - name: Verify startup without real accounts or network access
        run: sh bin/smoke-image.sh jmap-candidate:${{ matrix.arch }}

      - name: Publish tested image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          build-args: FORK_REVISION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Create the multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -eu
          refs=""
          for f in *; do
            refs="$refs ${REGISTRY}/${IMAGE_NAME}@$(cat "$f")"
          done
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$META_JSON")
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $refs
          first=$(jq -cr '.tags[0]' <<< "$META_JSON")
          echo "first_tag=$first" >> "$GITHUB_OUTPUT"

      - name: Show what was published
        env:
          FIRST_TAG: ${{ steps.manifest.outputs.first_tag }}
        run: docker buildx imagetools inspect "$FIRST_TAG"
